name: IP plan check

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build checker image
        run: docker build -t ipcheck .

      - name: Check the address plan
        id: check
        shell: bash
        run: docker run --rm ipcheck | tee report.txt

      - name: Open an issue with the report
        if: failure() && steps.check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
            -v "$PWD/report.txt:/app/report.txt" \
            ipcheck python report_issue.py
